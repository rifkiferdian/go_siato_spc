{{ define "admin/sidebar" }}
<aside class="hidden h-screen flex-col border-r border-[#dbe3ef] bg-white lg:sticky lg:top-0 lg:flex">
  <a href="/dashboard" class="flex h-[94px] shrink-0 items-center gap-3 px-[18px]"><span class="grid size-[44px] shrink-0 place-items-center rounded-[15px] bg-gradient-to-br from-[#b52ab5] to-[#670067] text-white shadow-[0_9px_18px_rgba(147,32,147,.25)]"><i class="fa-regular fa-floppy-disk text-[17px]"></i></span><span class="min-w-0"><strong class="block truncate text-[16px] font-black leading-5 tracking-[-.025em]">SIATO Finance</strong><span class="mt-1 block text-[12px] font-medium leading-4 text-[#800080]">Admin Keuangan</span></span></a>
  <nav class="sidebar-scrollbar-hidden min-h-0 flex-1 overflow-y-auto px-[15px] pb-5" aria-label="Navigasi dashboard">
    <p class="mb-2 px-3 pt-3 text-[12px] font-bold uppercase tracking-[.1em] text-[#90a2bf]">Menu Utama</p>
    <a href="/dashboard" class="relative flex h-[45px] items-center gap-3 rounded-[11px] bg-[#8e1a8e] px-3 font-bold text-white shadow-[0_5px_10px_rgba(147,32,147,.22)]"><span class="absolute inset-y-[9px] -left-[2px] w-1 rounded-r-full bg-white"></span><i class="fa-solid fa-house w-5 text-center text-[16px]"></i><span class="text-[14px]">Dashboard</span></a>
    {{ range .NavGroups }}<details data-sidebar-group class="group/sidebar admin-nav-group mt-2"><summary class="flex h-[43px] cursor-pointer list-none items-center gap-3 rounded-[10px] px-3 text-[#173254] transition hover:bg-[#fbf3fb] hover:text-[#800080] [&::-webkit-details-marker]:hidden"><i class="fa-solid {{ .Icon }} w-5 text-center text-[15px] text-[#8fa5c4]"></i><span class="text-[13px] font-medium">{{ .Label }}</span><i class="fa-solid fa-chevron-down ml-auto text-[10px] text-[#8fa5c4] transition-transform group-open/sidebar:rotate-180"></i></summary><div class="ml-5 border-l border-[#ead3ea] py-1 pl-3">{{ range .Items }}<a href="{{ .Href }}" class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-[12px] font-medium text-slate-500 hover:bg-violet-50 hover:text-violet-700"><span class="size-1.5 shrink-0 rounded-full bg-current"></span><span>{{ .Label }}</span></a>{{ end }}</div></details>{{ end }}
    <a href="#" class="mt-2 flex h-[43px] items-center gap-3 rounded-[10px] px-3 text-[#173254] transition hover:bg-[#fbf3fb] hover:text-[#800080]"><i class="fa-regular fa-file-lines w-5 text-center text-[15px] text-[#8fa5c4]"></i><span class="text-[13px] font-medium">Kwitansi</span></a>
    <p class="mb-2 mt-6 px-3 text-[12px] font-bold uppercase tracking-[.1em] text-[#90a2bf]">Analitik &amp; Sistem</p>
    <a href="#" class="flex h-[43px] items-center gap-3 rounded-[10px] px-3 text-[#173254] transition hover:bg-[#fbf3fb] hover:text-[#800080]"><i class="fa-solid fa-chart-simple w-5 text-center text-[15px] text-[#8fa5c4]"></i><span class="text-[13px] font-medium">Laporan</span></a>
    <a href="#" class="flex h-[43px] items-center gap-3 rounded-[10px] px-3 text-[#173254] transition hover:bg-[#fbf3fb] hover:text-[#800080]"><i class="fa-solid fa-gear w-5 text-center text-[15px] text-[#8fa5c4]"></i><span class="text-[13px] font-medium">Pengaturan</span></a>
  </nav>
  <div class="mx-[10px] mb-3 rounded-[15px] border border-[#f0d8ee] bg-[#fffaff] px-3 py-3"><p class="flex items-center gap-2 text-[12px] font-bold text-[#173254]"><span class="size-2 rounded-full bg-emerald-500"></span>Sistem Online</p><p class="mt-2 text-[12px] text-[#62799a]">Semua layanan berjalan normal.</p></div>
  <form action="/logout" method="post" class="shrink-0 border-t border-[#e4e9f1] px-[15px] py-3"><input type="hidden" name="csrf_token" value="{{ .User.CSRFToken }}"><button type="submit" class="group flex w-full items-center gap-3 rounded-[11px] px-3 py-3 text-[13px] font-bold text-[#334966] transition duration-200 hover:bg-red-50 hover:text-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500 active:bg-red-100"><span class="grid size-7 place-items-center rounded-lg bg-slate-100 text-[#8fa5c4] transition group-hover:bg-red-100 group-hover:text-red-600"><i class="fa-solid fa-arrow-right-from-bracket text-[14px]"></i></span><span>Keluar</span><i class="fa-solid fa-chevron-right ml-auto text-[9px] text-slate-300 transition group-hover:translate-x-0.5 group-hover:text-red-400"></i></button></form>
</aside>
{{ end }}
