root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["npm.cmd run css:build"]
cmd = "go build -o ./tmp/siato-spc.exe ./cmd/server"
bin = "tmp/siato-spc.exe"
include_ext = ["go", "html", "css"]
exclude_dir = ["bin", "node_modules", "tmp", "web/static"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = false
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
